name: Bug
description: Something that doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Herdr WoW is experimental, with a Herdr backend, native macOS support and an optional Linux/T3 Code backend for WoW: Forever. Detailed but straightforward reports help most: what happened, plainly, without an essay.

  - type: input
    id: versions
    attributes:
      label: Versions
      description: OS, Herdr (`herdr --version`), bridge (`herdr-wow status`), WoW Forever, and your controller if involved. Include T3 Code and Omarchy versions when using that backend.
      placeholder: e.g. macOS 15, Herdr 0.8.0, herdr-wow 0.1.0, Forever 1.60.x
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Steps to reproduce if you have them.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `herdr-wow status --log`, and the text from `/herdr report` in game. Remove private information before sharing.
      render: text

  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or video
      description: For anything you can see in game, drag in a screenshot or a short recording.
